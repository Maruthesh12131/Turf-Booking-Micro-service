spring.application.name=api-gateway
# Local runs: pick up the root .env file (KEY=VALUE, no quotes). Real environment variables still win over it.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]
server.port=${GATEWAY_PORT:8000}

# The gateway only forwards requests. Authentication and role checks stay in each service, which validates the
# Authorization header (JWT) itself, so a route here never makes an endpoint more open than it already is.
# Only the paths of real controllers are routed; anything else gets 404 from the gateway.
# Origin is dropped before forwarding because the gateway answers CORS itself (auth-service also has @CrossOrigin,
# which would otherwise add a second Access-Control-Allow-Origin header).
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:8080}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/users/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=RemoveRequestHeader=Origin

spring.cloud.gateway.server.webmvc.routes[1].id=turf-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${TURF_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/turfs/**,/sports/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=RemoveRequestHeader=Origin

spring.cloud.gateway.server.webmvc.routes[2].id=owner-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${OWNER_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/owners/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=RemoveRequestHeader=Origin

spring.cloud.gateway.server.webmvc.routes[3].id=booking-service
spring.cloud.gateway.server.webmvc.routes[3].uri=${BOOKING_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/bookings/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=RemoveRequestHeader=Origin

# Browser origins allowed to call the gateway (comma-separated).
gateway.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Health check for load balancers / orchestration: GET /actuator/health (details are not exposed).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
