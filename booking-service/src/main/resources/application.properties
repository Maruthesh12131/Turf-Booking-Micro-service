spring.application.name=booking-service
# Local runs: pick up the root .env file (KEY=VALUE, no quotes). Real environment variables still win over it.
# Both paths are listed so it works whether the working directory is the repo root (IDE) or the service folder (mvnw).
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]
server.port=${BOOKING_SERVICE_PORT:8084}
spring.datasource.url=${BOOKING_DB_URL:jdbc:postgresql://localhost:5432/turf_booking}
spring.datasource.username=${BOOKING_DB_USERNAME}
spring.datasource.password=${BOOKING_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Shared HS256 signing secret; must match auth-service. Supply via the JWT_SECRET environment variable.
jwt.secret=${JWT_SECRET}

# Booking dates and cancellation cutoffs are wall-clock times at the turf, in one fixed zone.
app.timezone=Asia/Kolkata

# RabbitMQ connection.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
# RabbitMQ exchange / queue / routing-key names. They must match across services (see .env.example).
app.rabbit.booking-commands-exchange=${BOOKING_COMMANDS_EXCHANGE:booking.commands}
app.rabbit.turf-events-exchange=${TURF_EVENTS_EXCHANGE:turf.events}
app.rabbit.reply-queue=${REPLY_QUEUE:booking-service.turf-replies}
app.rabbit.reply-dlq=${REPLY_DLQ:booking-service.turf-replies.dlq}
app.rabbit.reserve-key=${RESERVE_KEY:slots.reserve}
app.rabbit.confirm-key=${CONFIRM_KEY:slots.confirm}
app.rabbit.release-key=${RELEASE_KEY:slots.release}
app.rabbit.reserved-key=${RESERVED_KEY:slots.reserved}
app.rabbit.rejected-key=${REJECTED_KEY:slots.rejected}
app.rabbit.released-key=${RELEASED_KEY:slots.released}

# Publisher confirms + mandatory routing, so the outbox relay only marks a message sent once a queue has accepted it.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.connection-timeout=3s
outbox.relay-interval-ms=500

# Transient failures are retried 4 times, then the message goes to the dead-letter queue.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=4
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2

# How long POST /bookings waits for the outcome before answering 202 (the client can then poll GET /bookings/{id}).
booking.wait-seconds=5
# A booking still waiting for turf-service's answer gets its reserve command queued again after this long.
# Safe to repeat: turf-service answers a repeated command with the stored outcome. Slots are never released just because time passed.
booking.reserve-retry-after-seconds=30
spring.jpa.open-in-view=false

# Used to find the calling owner's id for GET /bookings/owner.
owner-service.url=${OWNER_SERVICE_URL:http://localhost:8083}
# A booking can be cancelled until this long before each slot starts.
booking.cancel-cutoff-minutes=60
