spring.application.name=auth-service
# Local runs: pick up the root .env file (KEY=VALUE, no quotes). Real environment variables still win over it.
# Both paths are listed so it works whether the working directory is the repo root (IDE) or the service folder (mvnw).
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]
server.port=${AUTH_SERVICE_PORT:8080}
spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/turf_auth}
spring.datasource.username=${AUTH_DB_USERNAME}
spring.datasource.password=${AUTH_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.org.springframework.security=DEBUG
# Shared HS256 signing secret; must be identical in every service. Supply via the JWT_SECRET environment variable.
jwt.secret=${JWT_SECRET}

# RabbitMQ connection.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.connection-timeout=3s

# RabbitMQ exchange / queue / routing-key names. They must match across services (see .env.example).
app.rabbit.auth-events-exchange=${AUTH_EVENTS_EXCHANGE:auth.events}
app.rabbit.owner-registered-key=${OWNER_REGISTERED_KEY:owner.registered}

# First-admin seeding (off unless both are set). Admins cannot sign themselves up, so set these once, e.g.
#   ADMIN_EMAIL=admin@example.com ADMIN_PASSWORD='at-least-12-characters'
# An existing account with that email is never modified, so the variables can stay set across restarts.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Administrator}
app.admin.phone=${ADMIN_PHONE:+910000000000}
